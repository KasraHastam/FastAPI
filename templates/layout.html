<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniBlog - {{ title }}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>

<body>

    <header>
        <h1><a href="{{ url_for('home') }}">MiniBlog</a></h1>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="/api/posts">API</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        <p>MiniBlog - 2026</p>
    </footer>

</body>
</html>
