{% extends "layout.html" %}

{% block content %}

<h2>Latest Posts</h2>

{% for post in posts %}

    <article class="post">

        <div class="metadata">
            <span>{{ post.author }}</span>
            <small>{{ post.date_posted }}</small>
        </div>

        <h2>
            <a href="{{ url_for('post_page', post_id=post.id) }}">
                {{ post.title }}
            </a>
        </h2>

        <p>{{ post.content }}</p>

    </article>

{% endfor %}

{% endblock content %}
